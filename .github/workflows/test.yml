env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: Generate TWRP Device Tree(test)

on:
  workflow_dispatch:
    inputs:
      LIBRARY_NAME:
        description: 'Library name for the device tree'
        required: true
        default: 'Twrp_Device_Generator'
      IMG_URL:
        description: 'URL to recovery/boot image'
        required: true
        default: 'https://github.com/Xxinn034/action_build_twrp_device_tree/raw/refs/heads/master/recovery.img'

jobs:
  generate-device-tree:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 \
          python3-pip \
          cpio \
          wget \
          zip \
          unzip \
          abootimg   # 新增安装 abootimg

    - name: Install TWRP generator
      run: |
        pip3 install --upgrade twrpdtgen

    - name: Download recovery image
      run: |
        wget -O recovery.img "${{ github.event.inputs.IMG_URL }}"
        file recovery.img || true

    # --- 新的预处理步骤：使用 abootimg 修补 build.prop ---
    - name: Patch recovery.img with missing build.prop property
      run: |
        # 1. 解包 recovery.img
        abootimg -x recovery.img
        # 生成 bootimg.cfg, kernel, initrd.img

        # 2. 解压 initrd (ramdisk)
        mkdir initrd
        cd initrd
        gunzip -c ../initrd.img | cpio -i

        # 3. 查找 build.prop 并添加缺失属性
        if [ -f build.prop ]; then
          echo "ro.build.version.security_patch=2026-08-01" >> build.prop
          echo "Patch added to build.prop (root)"
        elif [ -f system/build.prop ]; then
          echo "ro.build.version.security_patch=2026-08-01" >> system/build.prop
          echo "Patch added to system/build.prop"
        else
          echo "ERROR: build.prop not found in ramdisk"
          exit 1
        fi

        # 4. 重新打包 initrd
        find . | cpio -o -H newc | gzip > ../new-initrd.img
        cd ..

        # 5. 重新打包 recovery.img
        abootimg --create new-recovery.img -f bootimg.cfg -k kernel -r new-initrd.img

        # 6. 覆盖原 recovery.img
        cp new-recovery.img recovery.img

        # 7. 清理临时文件
        rm -rf initrd kernel initrd.img new-initrd.img bootimg.cfg new-recovery.img
    # -------------------------------------------

    - name: Generate device tree
      run: |
        mkdir -p device_tree_output
        python3 -m twrpdtgen \
          -o device_tree_output \
          recovery.img

    - name: Compress device tree
      run: |
        cd device_tree_output
        zip -r ../DeviceTree_${{ github.run_number }}.zip .
        cd ..

    - name: Create release with device tree
      uses: softprops/action-gh-release@v2
      with:
        files: DeviceTree_${{ github.run_number }}.zip
        name: TWRP_Device_Tree_${{ github.run_number }}
        tag_name: dt-${{ github.run_number }}
        body: |
          Automatically generated TWRP device tree
          Build run: ${{ github.run_number }}
          Source image: ${{ github.event.inputs.IMG_URL }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
