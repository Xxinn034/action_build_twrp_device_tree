env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: Generate TWRP Device Tree (test)

on:
  workflow_dispatch:
    inputs:
      LIBRARY_NAME:
        description: 'Library name for the device tree'
        required: true
        default: 'Twrp_Device_Generator'
      IMG_URL:
        description: 'URL to recovery/boot image'
        required: true
        default: 'https://github.com/Xxinn034/action_build_twrp_device_tree/raw/refs/heads/master/recovery.img'

jobs:
  generate-device-tree:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 \
          python3-pip \
          cpio \
          wget \
          zip \
          unzip

    - name: Install TWRP generator
      run: |
        pip3 install --upgrade twrpdtgen

    - name: Download recovery image
      run: |
        wget -O recovery.img "${{ github.event.inputs.IMG_URL }}"
        file recovery.img || true

    # --- 新增的预处理步骤：修补 recovery.img ---
    - name: Patch recovery.img with missing build.prop property
      run: |
        # 1. 克隆 Android Image Kitchen (AIK) 工具
        git clone https://github.com/osm0sis/Android-Image-Kitchen.git aik
        cp recovery.img aik/
        cd aik

        # 2. 确保脚本有执行权限
        chmod +x unpackimg.sh repackimg.sh

        # 3. 解包 recovery.img
        ./unpackimg.sh recovery.img

        # 4. 查找 build.prop 文件并添加缺失的属性
        #    首先检查 ramdisk 根目录，然后是 system 子目录
        if [ -f ramdisk/build.prop ]; then
          echo "ro.build.version.security_patch=2026-08-01" >> ramdisk/build.prop
          echo "Patch added to ramdisk/build.prop"
        elif [ -f ramdisk/system/build.prop ]; then
          echo "ro.build.version.security_patch=2026-08-01" >> ramdisk/system/build.prop
          echo "Patch added to ramdisk/system/build.prop"
        else
          echo "ERROR: Cannot find build.prop, abort."
          exit 1
        fi

        # 5. 重新打包镜像
        ./repackimg.sh

        # 6. 将新生成的镜像复制回工作目录，并覆盖原文件
        cp image-new.img ../recovery.img
        cd ..
        # 7. 清理 AIK 目录
        rm -rf aik
    # -------------------------------------------

    - name: Generate device tree
      run: |
        mkdir -p device_tree_output
        python3 -m twrpdtgen \
          -o device_tree_output \
          recovery.img

    - name: Compress device tree
      run: |
        cd device_tree_output
        zip -r ../DeviceTree_${{ github.run_number }}.zip .
        cd ..

    - name: Create release with device tree
      uses: softprops/action-gh-release@v2
      with:
        files: DeviceTree_${{ github.run_number }}.zip
        name: TWRP_Device_Tree_${{ github.run_number }}
        tag_name: dt-${{ github.run_number }}
        body: |
          Automatically generated TWRP device tree
          Build run: ${{ github.run_number }}
          Source image: ${{ github.event.inputs.IMG_URL }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
